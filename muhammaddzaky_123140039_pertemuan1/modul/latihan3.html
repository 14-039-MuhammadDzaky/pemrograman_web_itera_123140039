<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 3 - Array, Objek & Manipulasi Data Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
    .header h1 { font-size: 1.8rem; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }
    .nav-back { display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--primary); font-weight: 600; margin-bottom: 1rem; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #1e293b; display: flex; align-items: center; gap: 0.5rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; }
    input, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; }
    button:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-warning { background: var(--warning); color: #0f172a; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; font-weight: 700; color: #334155; }
    .result-box { margin-top: 1rem; padding: 1rem; background: #e0e7ff; border-left: 4px solid var(--primary); border-radius: 6px; font-size: 0.9rem; }
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--card-bg);
      transition: all 0.2s;
    }
    .nav-tab:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    .nav-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-tabs">
      <a href="latihan1.html" class="nav-tab"><i class="fa-solid fa-code"></i> Latihan 1</a>
      <a href="latihan2.html" class="nav-tab"><i class="fa-solid fa-repeat"></i> Latihan 2</a>
      <a href="latihan3.html" class="nav-tab active"><i class="fa-solid fa-users-gear"></i> Latihan 3</a>
      <a href="latihan4.html" class="nav-tab"><i class="fa-solid fa-layer-group"></i> Latihan 4</a>
    </nav>
    <div class="header">
      <h1><i class="fa-solid fa-users-gear"></i> Latihan 3: Array Objek & CRUD Mahasiswa</h1>
      <p>Praktikum PAW Pertemuan 1 - Muhammad Dzaky (123140039)</p>
    </div>

    <!-- Form CRUD Data Mahasiswa -->
    <div class="card">
      <h2 id="formTitle"><i class="fa-solid fa-user-plus"></i> Form Data Mahasiswa (Create / Update)</h2>
      <input type="hidden" id="editIndex" value="-1">
      <div class="form-grid">
        <div class="form-group">
          <label for="mhsNama">Nama Mahasiswa:</label>
          <input type="text" id="mhsNama" placeholder="Nama Lengkap">
        </div>
        <div class="form-group">
          <label for="mhsNim">NIM:</label>
          <input type="text" id="mhsNim" placeholder="NIM Mahasiswa">
        </div>
        <div class="form-group">
          <label for="mhsJurusan">Jurusan:</label>
          <input type="text" id="mhsJurusan" placeholder="Teknik Informatika / IF">
        </div>
        <div class="form-group">
          <label for="mhsNilai">Nilai (0-100):</label>
          <input type="number" id="mhsNilai" placeholder="85" min="0" max="100">
        </div>
      </div>
      <div class="btn-group">
        <button id="btnSimpanMhs"><i class="fa-solid fa-floppy-disk"></i> Simpan Mahasiswa</button>
        <button id="btnBatalMhs" class="btn-secondary" style="display:none;"><i class="fa-solid fa-xmark"></i> Batal Edit</button>
      </div>
    </div>

    <!-- Tabel Data Mahasiswa & Operasi Array -->
    <div class="card">
      <h2><i class="fa-solid fa-table"></i> Daftar Data Mahasiswa</h2>
      
      <!-- Action Filters & Sorting -->
      <div class="btn-group">
        <button onclick="tampilkanSemuaMhs()"><i class="fa-solid fa-list"></i> Semua Data</button>
        <button onclick="cariTertinggi()"><i class="fa-solid fa-trophy"></i> Nilai Tertinggi</button>
        <button onclick="filterDiatasRataRata()"><i class="fa-solid fa-filter"></i> Di Atas Rata-rata</button>
        <button onclick="urutkanNama('asc')" class="btn-secondary"><i class="fa-solid fa-arrow-down-a-z"></i> Urut Nama (Asc)</button>
        <button onclick="urutkanNama('desc')" class="btn-secondary"><i class="fa-solid fa-arrow-up-z-a"></i> Urut Nama (Desc)</button>
      </div>

      <div id="infoAnalisis" class="result-box">Analisis Data Mahasiswa</div>

      <table id="mhsTable">
        <thead>
          <tr>
            <th>No</th>
            <th>NIM</th>
            <th>Nama Mahasiswa</th>
            <th>Jurusan</th>
            <th>Nilai</th>
            <th>Aksi (CRUD)</th>
          </tr>
        </thead>
        <tbody id="mhsTableBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    /**
     * LATIHAN 3: Array Objek, Method Array & Fitur CRUD Data Mahasiswa
     * Praktikum PAW - Muhammad Dzaky (123140039)
     */

    // 1. Initial Array Mahasiswa (Minimal 5 Objek)
    let dataMahasiswa = [
      { nama: "Muhammad Dzaky", nim: "123140039", jurusan: "Teknik Informatika", nilai: 95 },
      { nama: "Ahmad Rizky", nim: "123140001", jurusan: "Teknik Informatika", nilai: 82 },
      { nama: "Budi Santoso", nim: "123140015", jurusan: "Teknik Sipil", nilai: 68 },
      { nama: "Citra Lestari", nim: "123140022", jurusan: "Sistem Informasi", nilai: 88 },
      { nama: "Dewi Anggraini", nim: "123140030", jurusan: "Teknik Elektro", nilai: 74 }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderTable(dataMahasiswa);
      updateAnalisis(dataMahasiswa);

      // Form Submit Handler (Create / Update)
      document.getElementById("btnSimpanMhs").addEventListener("click", simpanMahasiswa);
      document.getElementById("btnBatalMhs").addEventListener("click", batalEdit);
    });

    // Render HTML Table
    function renderTable(list) {
      const tbody = document.getElementById("mhsTableBody");
      tbody.innerHTML = "";

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #64748b;">Tidak ada data mahasiswa.</td></tr>`;
        return;
      }

      list.forEach((mhs, index) => {
        // Find original index in dataMahasiswa for edit/delete
        const originalIndex = dataMahasiswa.indexOf(mhs);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${mhs.nim}</strong></td>
          <td>${mhs.nama}</td>
          <td>${mhs.jurusan}</td>
          <td><span style="font-weight:bold; color: ${mhs.nilai >= 70 ? '#10b981' : '#ef4444'}">${mhs.nilai}</span></td>
          <td>
            <button onclick="editMahasiswa(${originalIndex})" class="btn-warning btn-sm"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            <button onclick="hapusMahasiswa(${originalIndex})" class="btn-danger btn-sm"><i class="fa-solid fa-trash"></i> Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Update Ringkasan Analisis (Rata-rata, Jumlah Data)
    function updateAnalisis(list) {
      if (list.length === 0) {
        document.getElementById("infoAnalisis").innerText = "Belum ada data mahasiswa untuk dianalisis.";
        return;
      }
      const totalNilai = list.reduce((sum, item) => sum + item.nilai, 0);
      const rataRata = (totalNilai / list.length).toFixed(2);
      document.getElementById("infoAnalisis").innerText = `Total Mahasiswa: ${list.length} | Rata-Rata Nilai: ${rataRata}`;
    }

    // 2. Cari Mahasiswa Nilai Tertinggi (Method Array reduce)
    function cariTertinggi() {
      if (dataMahasiswa.length === 0) return;
      const tertinggi = dataMahasiswa.reduce((prev, current) => (prev.nilai > current.nilai) ? prev : current);
      renderTable([tertinggi]);
      document.getElementById("infoAnalisis").innerText = `Mahasiswa Nilai Tertinggi: ${tertinggi.nama} (NIM: ${tertinggi.nim}) dengan Nilai: ${tertinggi.nilai}`;
    }

    // 3. Filter Mahasiswa di Atas Rata-rata
    function filterDiatasRataRata() {
      if (dataMahasiswa.length === 0) return;
      const totalNilai = dataMahasiswa.reduce((sum, item) => sum + item.nilai, 0);
      const avg = totalNilai / dataMahasiswa.length;
      const filtered = dataMahasiswa.filter(mhs => mhs.nilai > avg);
      
      renderTable(filtered);
      document.getElementById("infoAnalisis").innerText = `Daftar Mahasiswa dengan Nilai di Atas Rata-rata (${avg.toFixed(2)}): ${filtered.length} Orang`;
    }

    // 4. Urutkan Mahasiswa Berdasarkan Nama (Ascending/Descending)
    function urutkanNama(order = 'asc') {
      const sorted = [...dataMahasiswa].sort((a, b) => {
        if (order === 'asc') return a.nama.localeCompare(b.nama);
        return b.nama.localeCompare(a.nama);
      });
      renderTable(sorted);
      document.getElementById("infoAnalisis").innerText = `Data diurutkan berdasarkan Nama (${order.toUpperCase()})`;
    }

    function tampilkanSemuaMhs() {
      renderTable(dataMahasiswa);
      updateAnalisis(dataMahasiswa);
    }

    // 5. CRUD: Create & Update
    function simpanMahasiswa() {
      const namaInput = document.getElementById("mhsNama").value.trim();
      const nimInput = document.getElementById("mhsNim").value.trim();
      const jurusanInput = document.getElementById("mhsJurusan").value.trim();
      const nilaiInput = parseFloat(document.getElementById("mhsNilai").value);
      const editIndex = parseInt(document.getElementById("editIndex").value);

      if (!namaInput || !nimInput || !jurusanInput || isNaN(nilaiInput)) {
        alert("Harap isi seluruh field data mahasiswa dengan benar!");
        return;
      }

      const objMhs = { nama: namaInput, nim: nimInput, jurusan: jurusanInput, nilai: nilaiInput };

      if (editIndex >= 0) {
        // Update
        dataMahasiswa[editIndex] = objMhs;
        alert("Data mahasiswa berhasil diperbarui!");
      } else {
        // Create
        dataMahasiswa.push(objMhs);
        alert("Mahasiswa baru berhasil ditambahkan!");
      }

      resetForm();
      tampilkanSemuaMhs();
    }

    function editMahasiswa(index) {
      const mhs = dataMahasiswa[index];
      document.getElementById("mhsNama").value = mhs.nama;
      document.getElementById("mhsNim").value = mhs.nim;
      document.getElementById("mhsJurusan").value = mhs.jurusan;
      document.getElementById("mhsNilai").value = mhs.nilai;
      document.getElementById("editIndex").value = index;

      document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Edit Data Mahasiswa: ${mhs.nama}`;
      document.getElementById("btnBatalMhs").style.display = "inline-block";
    }

    function hapusMahasiswa(index) {
      if (confirm(`Yakin ingin menghapus data mahasiswa "${dataMahasiswa[index].nama}"?`)) {
        dataMahasiswa.splice(index, 1);
        tampilkanSemuaMhs();
      }
    }

    function batalEdit() {
      resetForm();
    }

    function resetForm() {
      document.getElementById("mhsNama").value = "";
      document.getElementById("mhsNim").value = "";
      document.getElementById("mhsJurusan").value = "";
      document.getElementById("mhsNilai").value = "";
      document.getElementById("editIndex").value = "-1";

      document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-user-plus"></i> Form Data Mahasiswa (Create / Update)`;
      document.getElementById("btnBatalMhs").style.display = "none";
    }
  </script>
</body>
</html>
